<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>INFPORT — Sistema Multi Portaria 1.0</title>
    <meta name="description" content="Sistema de gestão operacional para portarias e postos multi-condomínio com controle de encomendas, custódia, materiais, chaves, manutenção, rondas e passagem de turno." />
    <meta property="og:title" content="INFPORT — Sistema Multi Portaria 1.0" />
    <meta property="og:description" content="Sistema de gestão operacional para portarias e postos multi-condomínio com controle de encomendas, custódia, materiais, chaves, manutenção, rondas e passagem de turno." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="INFPORT" />
    <meta name="application-name" content="INFPORT" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registration for PWA Installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA ServiceWorker registrado com sucesso:', reg.scope))
            .catch((err) => console.warn('Falha ao registrar ServiceWorker:', err));
        });
      }
    </script>
  </body>
</html>
